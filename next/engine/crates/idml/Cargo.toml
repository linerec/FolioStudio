[package]
build = "../../test-inputs.rs"
name = "folio-idml"
description = "IDML package to Folio model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
folio-model.workspace = true
folio-color.workspace = true
serde_json.workspace = true
serde.workspace = true
# Deflate decompression only (pure Rust zlib-rs backend); no other codecs, crypto or time.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false }
regex = { version = "=1.12.2", default-features = false, features = ["std", "unicode", "perf"] }
# Data Merge sources in Shift_JIS and Windows-1252 (pure Rust; no table from Adobe)
encoding_rs = "=0.8.42"

[[bin]]
name = "idml-dump"
path = "src/bin/idml-dump.rs"
