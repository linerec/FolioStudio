[package]
name = "folio-textimport"
description = "Reading text files (.txt, .docx, .rtf) into paragraphs and runs, the way InDesign places them"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Code pages of the Character Set choice (Korean, Japanese, Chinese ...); already in the lockfile through the PDF reader. BSD-3-Clause / Apache-2.0.
encoding_rs = "=0.8.42"
# .docx is a zip; the same zip crate and backend the IDML reader uses.
# the .docx parts are XML: the same reader the IDML crates use.
quick-xml = { version = "=0.42.0", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
