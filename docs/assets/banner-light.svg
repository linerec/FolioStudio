<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Folio Studio</title>
  <desc id="d">Open-source desktop publishing. Project folders that travel, IDML round-trip, print-ready PDF/X.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a86f0"/>
      <stop offset="1" stop-color="#2459c4"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a65a"/>
      <stop offset="0.55" stop-color="#e2557a"/>
      <stop offset="1" stop-color="#5b4bd6"/>
    </linearGradient>
    <linearGradient id="photo2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fb5a8"/>
      <stop offset="1" stop-color="#2f6fdc"/>
    </linearGradient>
    <pattern id="baseline" width="1280" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="13.5" x2="1280" y2="13.5" stroke="#1b2a4a" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#baseline)"/>

  <!-- layout guides -->
  <g stroke-width="1">
    <line x1="72" y1="0" x2="72" y2="420" stroke="#d94bd0" stroke-opacity="0.28"/>
    <line x1="1208" y1="0" x2="1208" y2="420" stroke="#d94bd0" stroke-opacity="0.28"/>
    <line x1="0" y1="56" x2="1280" y2="56" stroke="#d94bd0" stroke-opacity="0.28"/>
    <line x1="0" y1="364" x2="1280" y2="364" stroke="#d94bd0" stroke-opacity="0.28"/>
    <line x1="640" y1="0" x2="640" y2="420" stroke="#33c3e6" stroke-opacity="0.12" stroke-dasharray="4 6"/>
  </g>

  <!-- trim marks -->
  <g stroke="#6b7590" stroke-opacity="0.7" stroke-width="1.2">
    <path d="M40 56 H60 M72 24 V44"/>
    <path d="M1240 56 H1220 M1208 24 V44"/>
    <path d="M40 364 H60 M72 396 V376"/>
    <path d="M1240 364 H1220 M1208 396 V376"/>
  </g>

  <!-- brand -->
  <g transform="translate(104 128)">
    <rect width="132" height="132" rx="22" fill="url(#tile)"/>
    <text x="66" y="88" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#ffffff">Fo</text>  </g>
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="268" y="196" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#141821">Folio Studio</text>
    <text x="270" y="238" font-size="25" fill="#4a5468">Open-source desktop publishing</text>
    <text xml:space="preserve" x="270" y="282" font-size="15" font-weight="600" letter-spacing="1.6" fill="#6b7590">PROJECT FOLDERS<tspan fill="#4a86f0" font-weight="700">  ·  </tspan>IDML ROUND-TRIP<tspan fill="#4a86f0" font-weight="700">  ·  </tspan>PDF/X</text>
  </g>
  <!-- CMYK -->
  <g transform="translate(272 310)">
    <circle cx="0" cy="0" r="7" fill="#00a6e3"/>
    <circle cx="22" cy="0" r="7" fill="#e3007d"/>
    <circle cx="44" cy="0" r="7" fill="#ffd400"/>
    <circle cx="66" cy="0" r="7" fill="#0b0b0b" stroke="#5b6274"/>
  </g>

  <!-- magazine spread -->
  <g transform="translate(724 82) rotate(-4 220 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="270" fill="#fbfaf7"/>
    <rect x="210" y="0" width="210" height="270" fill="#f6f4ef"/>
    <line x1="210" y1="0" x2="210" y2="270" stroke="#000" stroke-opacity="0.12"/>
    <!-- left page -->
    <rect x="18" y="20" width="174" height="128" fill="url(#photo)"/>
    <circle cx="150" cy="58" r="20" fill="#fff" fill-opacity="0.25"/>
    <path d="M18 148 L70 104 L104 132 L138 96 L192 148 Z" fill="#000" fill-opacity="0.18"/>
    <rect x="18" y="162" width="120" height="13" fill="#1d2230"/>
    <rect x="18" y="181" width="84" height="13" fill="#1d2230"/>
    <g fill="#9aa1af">
      <rect x="18" y="204" width="82" height="4"/><rect x="110" y="204" width="82" height="4"/>
      <rect x="18" y="213" width="82" height="4"/><rect x="110" y="213" width="76" height="4"/>
      <rect x="18" y="222" width="78" height="4"/><rect x="110" y="222" width="82" height="4"/>
      <rect x="18" y="231" width="82" height="4"/><rect x="110" y="231" width="60" height="4"/>
      <rect x="18" y="240" width="64" height="4"/>
    </g>
    <!-- right page -->
    <rect x="228" y="20" width="22" height="22" fill="#2f6fdc"/>
    <text x="239" y="37" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#fff">A</text>
    <g fill="#9aa1af">
      <rect x="256" y="22" width="56" height="4"/><rect x="320" y="22" width="82" height="4"/>
      <rect x="256" y="31" width="56" height="4"/><rect x="320" y="31" width="82" height="4"/>
      <rect x="256" y="40" width="50" height="4"/><rect x="320" y="40" width="70" height="4"/>
      <rect x="228" y="52" width="84" height="4"/><rect x="320" y="52" width="82" height="4"/>
      <rect x="228" y="61" width="84" height="4"/><rect x="320" y="61" width="82" height="4"/>
      <rect x="228" y="70" width="78" height="4"/><rect x="320" y="70" width="64" height="4"/>
    </g>
    <rect x="228" y="88" width="174" height="44" fill="#eef2fb"/>
    <rect x="228" y="88" width="3" height="44" fill="#2f6fdc"/>
    <text x="242" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#2b3550">“Open it anywhere.”</text>
    <rect x="228" y="146" width="174" height="96" fill="url(#photo2)"/>
    <g fill="#ffffff" fill-opacity="0.35">
      <rect x="244" y="214" width="16" height="16"/><rect x="266" y="198" width="16" height="32"/>
      <rect x="288" y="182" width="16" height="48"/><rect x="310" y="170" width="16" height="60"/>
      <rect x="332" y="190" width="16" height="40"/><rect x="354" y="160" width="16" height="70"/>
    </g>
    <text x="402" y="260" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#9aa1af">27</text>
    <text x="18" y="260" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#9aa1af">26</text>
  </g>
  <!-- selection handles on the spread -->
  <g transform="translate(724 82) rotate(-4 220 130)" fill="none">
    <rect x="18" y="20" width="174" height="128" stroke="#2f6fdc" stroke-width="1.5"/>
    <g fill="#fff" stroke="#2f6fdc" stroke-width="1.5">
      <rect x="14" y="16" width="8" height="8"/><rect x="188" y="16" width="8" height="8"/>
      <rect x="14" y="144" width="8" height="8"/><rect x="188" y="144" width="8" height="8"/>
      <rect x="101" y="16" width="8" height="8"/><rect x="101" y="144" width="8" height="8"/>
    </g>
  </g>
</svg>
